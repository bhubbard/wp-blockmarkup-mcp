[package]
name = "wp-block-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_ast_visit = "0.133.0"
oxc_parser = "0.133.0"
oxc_semantic = "0.133.0"
oxc_span = "0.133.0"
jsonschema = "0.46.5"
regex = "1.12.3"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
walkdir = "2.5.0"
